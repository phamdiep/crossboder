<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="slides-format" content="viewport" />
  <title>Cross-Border Payments in APAC: Tech Strategy for SG–VN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-bg: #020617;
      --color-bg-deep: #020617;
      --color-surface: #020617;
      --color-text: #e2e8f0;
      --color-text-secondary: #cbd5f5;
      --color-text-muted: #64748b;
      --color-accent-1: #22c55e;
      --color-accent-2: #22d3ee;
      --color-accent-3: #a855f7;
      --color-glass-bg: rgba(15,23,42,0.86);
      --color-glass-border: rgba(148,163,184,0.55);
      --color-vignette: rgba(0,0,0,0.55);
      --font-display: 'Instrument Serif', Georgia, serif;
      --font-body: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
  </style>
  <style>
    :root { --color-bg:#020617; --color-text:#e2e8f0; --glow-color-rgb:34,197,94; }
    *,*::before,*::after{box-sizing:border-box;}
    html,body{margin:0;background:var(--color-bg);} 
    body{font-family:var(--font-body);color:var(--color-text);overflow:hidden;height:100vh;width:100vw;}
    .deck{width:100vw;height:100vh;position:relative;}
    .slide{position:absolute;inset:0;background:radial-gradient(circle at top left,#0b1120 0,#020617 55%,#000 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transform:scale(.96);transition:opacity .7s ease,transform .7s ease;pointer-events:none;overflow:hidden;}
    .slide.active{opacity:1;transform:scale(1);pointer-events:auto;}
    .slide>.content{position:relative;z-index:2;width:100%;max-width:1120px;padding:clamp(1.5rem,4vw,4rem);}
    .nav-controls{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;z-index:100;background:rgba(15,23,42,.92);backdrop-filter:blur(14px);padding:10px 24px;border-radius:999px;border:1px solid rgba(148,163,184,.65);}
    .nav-btn{width:40px;height:40px;border:none;background:rgba(15,23,42,.9);color:#22c55e;border-radius:999px;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .25s,transform .25s,box-shadow .25s;}
    .nav-btn:hover{background:rgba(30,64,175,.9);box-shadow:0 0 0 1px rgba(56,189,248,.3);transform:translateY(-1px);}
    .slide-dots{display:flex;gap:8px;}
    .dot{width:9px;height:9px;border-radius:999px;background:rgba(148,163,184,.55);cursor:pointer;transition:background .25s,transform .25s,box-shadow .25s;}
    .dot.active{background:#22c55e;transform:scale(1.35);box-shadow:0 0 0 4px rgba(34,197,94,.22);} 
    .slide-counter{font-size:.8rem;color:#94a3b8;min-width:46px;text-align:center;font-variant-numeric:tabular-nums;}
    .reveal{opacity:0;transform:translateY(18px);} 
    @keyframes float-slow{0%,100%{transform:translate(0,0) scale(1);}25%{transform:translate(60px,-40px) scale(1.08);}50%{transform:translate(-40px,35px) scale(.94);}75%{transform:translate(45px,10px) scale(1.04);}}
    @keyframes float-drift{0%,100%{transform:translate(0,0) scale(1) rotate(0deg);}33%{transform:translate(-40px,-50px) scale(1.08) rotate(2deg);}66%{transform:translate(30px,25px) scale(.92) rotate(-2deg);}}
    @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
    .gradient-mesh{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
    .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.12;animation:float-slow 14s ease-in-out infinite;}
    .blob:nth-child(2){animation:float-drift 18s ease-in-out infinite;}
    .blob:nth-child(3){animation:float-slow 22s ease-in-out infinite reverse;}
    .slide::before{content:"";position:absolute;inset:-60px;z-index:1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");background-size:260px 260px;mix-blend-mode:soft-light;pointer-events:none;}
    .slide::after{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.65) 100%);pointer-events:none;}
    .mouse-spotlight{mix-blend-mode:screen;}
    .text-glow{ text-shadow:0 0 26px rgba(var(--glow-color-rgb),0.55),0 0 48px rgba(var(--glow-color-rgb),0.28);} 
    .stat-glow{ text-shadow:0 0 36px rgba(var(--glow-color-rgb),0.75),0 0 70px rgba(var(--glow-color-rgb),0.32);} 
    @keyframes glow-pulse{0%,100%{text-shadow:0 0 24px rgba(var(--glow-color-rgb),0.6),0 0 50px rgba(var(--glow-color-rgb),0.25);}50%{text-shadow:0 0 36px rgba(var(--glow-color-rgb),0.9),0 0 80px rgba(var(--glow-color-rgb),0.4);}}
    .glow-pulse{animation:glow-pulse 3.3s ease-in-out infinite;}
    .bar-chart{display:flex;align-items:flex-end;gap:clamp(.4rem,1vw,.8rem);height:clamp(120px,22vh,210px);} 
    .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:.35rem;}
    .bar{width:100%;border-radius:8px 8px 0 0;background:linear-gradient(to top,#22c55e,#22d3ee);} 
    .bar-label{font-size:.8rem;color:#cbd5f5;opacity:.9;}
    .bar-value{font-size:.85rem;color:#e2e8f0;font-variant-numeric:tabular-nums;}
    .bar-track{position:relative;width:100%;height:0.9rem;border-radius:999px;background:rgba(15,23,42,.95);overflow:hidden;border:1px solid rgba(148,163,184,.55);} 
    .bar-fill{position:absolute;inset:0;width:0;border-radius:999px;background:linear-gradient(to right,#22c55e,#22d3ee);} 
    .gauge{width:160px;height:160px;border-radius:999px;background:conic-gradient(from 220deg,rgba(34,197,94,.08) 0,rgba(34,197,94,.85) 210deg,rgba(148,163,184,.45) 210deg,rgba(15,23,42,1) 320deg);} 
    .gauge-inner{width:70%;height:70%;border-radius:999px;background:radial-gradient(circle at 30% 20%,rgba(148,163,184,.3),rgba(15,23,42,1));display:flex;align-items:center;justify-content:center;border:1px solid rgba(148,163,184,.6);} 
    .odometer{display:inline-flex;gap:0;font-variant-numeric:tabular-nums;overflow:hidden;} 
    .odometer-digit{display:flex;flex-direction:column;line-height:1;height:1em;overflow:hidden;transform:translateY(0);transition:transform 1.4s cubic-bezier(.16,1,.3,1);} 
    .odometer-digit span{display:block;text-align:center;} 
    .odometer-separator{opacity:.7;} 
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.2s !important;}}
  </style>
</head>
